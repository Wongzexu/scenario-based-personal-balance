<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图标管理器 — Icon Manager</title>
<style>
  :root {
    --bg: #f8f9fa;
    --card: #fff;
    --border: #e5e7eb;
    --text: #374151;
    --muted: #9ca3af;
    --primary: #0d9488;
    --primary-light: #ccfbf1;
    --success: #10b981;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    max-width: 1400px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1f2937;
    white-space: nowrap;
  }
  .stats {
    display: flex;
    gap: 12px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .stats span {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .stats .registered { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }
  .cli-hints {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .hint-chip {
    font-size: 0.72rem;
    padding: 3px 10px;
    border: 1px solid #d1d5db;
    border-radius: 14px;
    cursor: pointer;
    color: #6b7280;
    font-family: "SF Mono", "Fira Code", monospace;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
  }
  .hint-chip:hover {
    background: #1f2937;
    color: #fff;
    border-color: #1f2937;
  }

  /* Toolbar */
  .toolbar {
    max-width: 1400px;
    margin: 0 auto 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 9px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
    background: var(--card);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--primary); }
  .filter-btn {
    padding: 9px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { background: #f3f4f6; }
  .filter-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .action-btn {
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius);
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .action-btn.copy {
    background: var(--primary);
    color: #fff;
  }
  .action-btn.copy:hover { opacity: 0.9; }
  .action-btn.copy:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Selected count */
  .selected-info {
    font-size: 0.82rem;
    color: var(--muted);
    white-space: nowrap;
    display: none;
  }
  .selected-info.visible { display: inline; }

  /* Grid */
  .icon-grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
  }
  .icon-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 8px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    user-select: none;
  }
  .icon-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }
  .icon-card.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    box-shadow: 0 0 0 2px rgba(13,148,136,0.2);
  }
  .icon-card.registered {
    border-left: 4px solid var(--success);
  }
  .icon-card .preview {
    width: 40px;
    height: 40px;
    margin: 0 auto 6px;
    color: #4b5563;
  }
  .icon-card .preview svg {
    width: 40px;
    height: 40px;
  }
  .icon-card .name {
    font-size: 0.7rem;
    color: var(--muted);
    word-break: break-all;
    line-height: 1.3;
  }
  .icon-card .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: 600;
  }
  .badge.reg {
    background: #ecfdf5;
    color: #065f46;
  }
  .badge.new {
    background: #fef3c7;
    color: #92400e;
  }

  /* Code panel */
  .code-panel {
    max-width: 1400px;
    margin: 20px auto;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    display: none;
  }
  .code-panel.visible { display: block; }
  .code-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: #fafafa;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .code-panel-header h3 { font-size: 0.9rem; }
  .code-panel-header button {
    font-size: 0.78rem;
    padding: 4px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  .code-panel-header button:hover { background: #f3f4f6; }
  .code-panel-columns {
    display: flex;
    gap: 16px;
    padding: 16px 18px;
  }
  @media (max-width: 640px) { .code-panel-columns { flex-direction: column; } }
  .code-panel-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .col-label {
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: var(--text);
  }
  .col-hint {
    font-size: 0.73rem;
    color: var(--muted);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .col-hint code {
    background: #f3f4f6;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.72rem;
  }
  .copy-btn {
    margin-top: 8px;
    padding: 8px 16px;
    border: 1.5px solid var(--primary);
    border-radius: 6px;
    background: #fff;
    color: var(--primary);
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
    align-self: flex-start;
  }
  .copy-btn:hover { background: var(--primary); color: #fff; }
  .copy-btn:active { transform: scale(0.97); }
  .code-panel textarea {
    width: 100%;
    min-height: 120px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.78rem;
    line-height: 1.6;
    resize: vertical;
    background: transparent;
    color: #1f2937;
    outline: none;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2937;
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 0.85rem;
    z-index: 999;
    animation: toastIn 0.25s ease-out;
    pointer-events: none;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .icon-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
  }
</style>
</head>
<body>

<div class="header">
  <div style="flex:1;min-width:200px;">
    <h1>🎨 图标管理器</h1>
    <div class="stats">
      <span>总计 <strong id="stat-total">0</strong></span>
      <span class="registered">已注册 <strong id="stat-reg">0</strong></span>
      <span>未注册 <strong id="stat-unreg">0</strong></span>
    </div>
  </div>
  <div class="cli-hints">
    <span class="hint-chip" onclick="copyCmd('node tools/icon-tools/add-icon.js 图标名')" title="点击复制">注册一个</span>
    <span class="hint-chip" onclick="copyCmd('node tools/icon-tools/add-icon.js --list')" title="点击复制">--list</span>
    <span class="hint-chip" onclick="copyCmd('node tools/icon-tools/add-icon.js --search 关键词')" title="点击复制">--search</span>
    <span class="hint-chip" onclick="copyCmd('node tools/icon-tools/add-icon.js --sync')" title="点击复制">--sync</span>
    <span class="hint-chip" onclick="copyCmd('node tools/icon-tools/add-icon.js --all')" title="点击复制">--all</span>
  </div>
</div>

<div class="toolbar">
  <input class="search-input" id="search" type="text" placeholder="搜索图标名称…（支持模糊匹配）" oninput="render()">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">全部</button>
  <button class="filter-btn" data-filter="unreg" onclick="setFilter('unreg', this)">未注册</button>
  <button class="filter-btn" data-filter="reg" onclick="setFilter('reg', this)">已注册</button>
  <span class="selected-info" id="selected-info">已选 <strong id="sel-count">0</strong> 个</span>
  <button class="action-btn copy" id="copy-btn" disabled onclick="showCode()">生成代码</button>
</div>

<div class="icon-grid" id="grid"></div>

<div class="code-panel" id="code-panel">
  <div class="code-panel-header">
    <h3 id="panel-title">注册以下 <span id="panel-count">0</span> 个图标</h3>
    <button onclick="closeCode()">关闭</button>
  </div>
  <div class="code-panel-columns">
    <div class="code-panel-col">
      <div class="col-label"><span style="color:var(--gray-400);font-size:0.75rem;">方式一</span> 手动粘贴</div>
      <div class="col-hint">打开 <code>js/core/icons-data.js</code>，把下面这段插入到最后一个图标后面（}<code>;</code> 之前）</div>
      <textarea id="code-manual" readonly></textarea>
      <button class="copy-btn" onclick="copyArea('code-manual')">复制代码</button>
    </div>
    <div class="code-panel-col">
      <div class="col-label"><span style="color:var(--gray-400);font-size:0.75rem;">方式二</span> CLI 命令</div>
      <div class="col-hint">在终端中执行（自动写入文件，无需粘贴）</div>
      <textarea id="code-cli" readonly></textarea>
      <button class="copy-btn" onclick="copyArea('code-cli')">复制命令</button>
    </div>
  </div>
</div>

<!-- 加载 icons-data.js 获取已注册列表 -->
<script src="../../js/core/icons-data.js"></script>
<!-- 加载 SVG 文件清单 -->
<script src="icon-list.js"></script>

<script>
// ============ 扫描 SVG 目录 ============
// 由于 file:// 无法扫描目录，这里维护一份图标库清单
// 运行 node scripts/add-icon.js --list 可以获取最新列表
var ALL_SVG_FILES = SVGLIST;

// 从 ICON_PATHS 获取已注册的图标名
var registeredSet = new Set(Object.keys(ICON_PATHS || {}));

// ============ 状态 ============
var filter = 'all';
var selected = new Set();

// ============ 函数 ============
function matchesFilter(name) {
  if (filter === 'all') return true;
  var isReg = registeredSet.has(name);
  if (filter === 'reg') return isReg;
  if (filter === 'unreg') return !isReg;
  return true;
}

function matchesSearch(name) {
  var q = document.getElementById('search').value.trim().toLowerCase();
  if (!q) return true;
  return name.toLowerCase().includes(q);
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  selected.clear();
  updateUI();
  render();
}

function toggleIcon(name) {
  if (selected.has(name)) {
    selected.delete(name);
  } else {
    selected.add(name);
  }
  updateUI();
  render();
}

function updateUI() {
  var count = selected.size;
  var info = document.getElementById('selected-info');
  var btn = document.getElementById('copy-btn');
  if (count > 0) {
    info.classList.add('visible');
    document.getElementById('sel-count').textContent = count;
    btn.disabled = false;
    btn.textContent = '生成代码 (' + count + ')';
  } else {
    info.classList.remove('visible');
    btn.disabled = true;
    btn.textContent = '生成代码';
  }
}

// ============ 渲染 ============
function render() {
  var filtered = ALL_SVG_FILES.filter(function(name) {
    return matchesFilter(name) && matchesSearch(name);
  });

  var html = '';
  filtered.forEach(function(name) {
    var isReg = registeredSet.has(name);
    var isSel = selected.has(name);
    var cls = 'icon-card';
    if (isReg) cls += ' registered';
    if (isSel) cls += ' selected';
    var svgContent;
    if (isReg) {
      svgContent = '<svg width="40" height="40" viewBox="0 0 1024 1024" fill="currentColor" xmlns="http://www.w3.org/2000/svg">' + ICON_PATHS[name] + '</svg>';
    } else {
      // 未注册用 img 标签加载原文件（file:// 下可用）
      svgContent = '<img src="../../src/assets/icons/' + name + '.svg" width="40" height="40" alt="" style="display:block;" onerror="this.parentElement.innerHTML=\'<div style=width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#d1d5db;font-size:20px;>?</div>\'">';
    }
    var badge = isReg ? '<div class="badge reg">✓</div>' : '<div class="badge new">+</div>';
    html += '<div class="' + cls + '" onclick="toggleIcon(\'' + name + '\')" title="' + name + (isReg ? ' (已注册)' : ' (未注册)') + '">';
    html += badge;
    html += '<div class="preview">' + svgContent + '</div>';
    html += '<div class="name">' + name + '</div>';
    html += '</div>';
  });

  document.getElementById('grid').innerHTML = html;

  // Stats
  document.getElementById('stat-total').textContent = ALL_SVG_FILES.length;
  document.getElementById('stat-reg').textContent = registeredSet.size;
  document.getElementById('stat-unreg').textContent = ALL_SVG_FILES.length - registeredSet.size;
}

// ============ 代码生成 ============
function extractPathsFromSvg(name) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '../../src/assets/icons/' + name + '.svg', false); // sync
    xhr.send();
    if (xhr.status === 200 || xhr.status === 0) {
      var raw = xhr.responseText;
      var matches = raw.match(/<path[\s\S]*?\/path>/g);
      return matches ? matches.join('') : '';
    }
  } catch(e) {}
  return '';
}

function showCode() {
  if (selected.size === 0) return;
  var names = [];
  var lines = [];
  var failed = [];
  selected.forEach(function(name) {
    names.push(name);
    var paths = (ICON_PATHS && ICON_PATHS[name]) || extractPathsFromSvg(name);
    if (paths) {
      lines.push("  '" + name + "': '" + paths + "',");
    } else {
      failed.push(name);
    }
  });

  // 方式一：手动粘贴代码
  var code = lines.join('\n');
  if (failed.length > 0) {
    code += '\n\n// ⚠ 以下文件读取失败，请手动处理：\n';
    failed.forEach(function(n) { code += "// '" + n + "': '',\n"; });
  }
  document.getElementById('code-manual').value = code;

  // 方式二：CLI 命令
  document.getElementById('code-cli').value = 'node tools/icon-tools/add-icon.js ' + names.join(' ');

  // 更新 UI
  document.getElementById('panel-count').textContent = names.length;
  document.getElementById('code-panel').classList.add('visible');
  document.getElementById('code-panel').scrollIntoView({ behavior: 'smooth' });
}

function closeCode() {
  document.getElementById('code-panel').classList.remove('visible');
}

function copyArea(id) {
  var area = document.getElementById(id);
  area.select();
  try {
    navigator.clipboard.writeText(area.value).then(function() {
      showToast('已复制');
    });
  } catch(e) {
    document.execCommand('copy');
    showToast('已复制');
  }
}

function copyCmd(cmd) {
  try {
    navigator.clipboard.writeText(cmd).then(function() {
      showToast('已复制: ' + cmd);
    });
  } catch(e) {
    showToast('已复制（去终端粘贴即可）');
  }
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2000);
}

// ============ 初始渲染 ============
render();
</script>
</body>
</html>
